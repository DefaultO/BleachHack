plugins {
	// ponytail: non-obf loom variant for deobfuscated MC 26.1+; the legacy "fabric-loom" id is the remap variant and demands mappings that no longer exist.
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/bleachhack.accesswidener")
}

repositories {
	maven {
		url "https://jitpack.io"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// ponytail: no mappings line — MC 26.2 ships deobfuscated (real net.minecraft names in the jar), so loom 1.17 builds against them directly. Yarn/Mojmap files no longer exist for this version.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// include(implementation("com.github.fzakaria:ascii85:1.2"))

	include(implementation("com.github.BleachDev:DiscordIPC:1dca11fce3")) {
		exclude group: 'com.google.code.gson', module: 'gson'
	}
	include(implementation("com.kohlschutter.junixsocket:junixsocket-common:2.2.1"))
	include(implementation("com.kohlschutter.junixsocket:junixsocket-native-common:2.2.1"))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ponytail: 21 is MC 26.2's runtime floor and the max-compatibility target; bump to 25 if a dependency needs it.
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}-${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
